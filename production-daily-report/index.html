<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Production Daily Report | Assembly Line MC</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:#f3f6f9;color:#1f2937}
header{background:#111827;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:20px;margin:0}.lang{font-size:13px;opacity:.85}
nav{display:flex;background:#fff;border-bottom:1px solid #dbe1e8;position:sticky;top:61px;z-index:4}
nav button{border:0;background:#fff;padding:14px 20px;font-weight:700;cursor:pointer}nav button.active{color:#0b63ce;border-bottom:3px solid #0b63ce}
main{max-width:1500px;margin:20px auto;padding:0 14px}.card{background:#fff;border:1px solid #dbe1e8;border-radius:10px;padding:18px;margin-bottom:18px;box-shadow:0 2px 7px #0000000a}
h2{margin:0 0 14px;font-size:18px}.sub{font-size:12px;color:#64748b}.grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:12px}
label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}label span{font-weight:400;color:#64748b}
input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:6px;padding:9px;background:#fff;font-size:14px}input:focus,select:focus{outline:2px solid #bfdbfe;border-color:#60a5fa}
.section-title{margin:18px 0 8px;padding:8px 10px;background:#eef4fb;border-left:4px solid #0b63ce;font-weight:800}
.table-wrap{overflow:auto;border:1px solid #cbd5e1}.entry{min-width:1450px;border-collapse:collapse;width:100%;font-size:11px}.entry th,.entry td{border:1px solid #cbd5e1;padding:4px;text-align:center}.entry th{background:#f8fafc}.entry input{padding:5px;font-size:11px;min-width:52px}.time{white-space:nowrap;font-weight:700}.break td{background:#fff600;font-weight:800}
.btn{border:0;border-radius:7px;padding:10px 15px;font-weight:800;cursor:pointer}.primary{background:#0b63ce;color:#fff}.secondary{background:#e2e8f0}.danger{background:#dc2626;color:#fff}.success{background:#16a34a;color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.note{font-size:12px;color:#64748b}
.list-grid{width:100%;border-collapse:collapse}.list-grid th,.list-grid td{border:1px solid #d7dde5;padding:9px;font-size:12px;text-align:left}.list-grid th{background:#f8fafc}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modal-box{background:#fff;width:min(1200px,100%);max-height:95vh;overflow:auto;padding:20px}.print-sheet{background:#fff;color:#000;font-family:Arial,"Noto Sans Thai",sans-serif;font-size:10px}.print-head{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;border-bottom:2px solid #000;padding-bottom:5px}.print-head h1{font-size:15px;margin:0 0 4px}.print-meta{border:1px solid #000}.print-meta div{display:grid;grid-template-columns:90px 1fr}.print-meta b,.print-meta span{padding:2px 4px;border-bottom:1px solid #000}.print-meta div:last-child span,.print-meta div:last-child b{border-bottom:0}.report-table{width:100%;border-collapse:collapse;margin-top:6px;table-layout:fixed}.report-table th,.report-table td{border:1px solid #000;padding:2px;text-align:center;height:22px}.report-table th{font-weight:700}.report-table .break td{background:#ff0}.small{font-size:8px}.foot-sign{display:grid;grid-template-columns:1fr 1fr 1fr;gap:30px;margin-top:30px;text-align:center}.muted{color:#64748b}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(140px,1fr))}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
@media print{body>*:not(#modal){display:none!important}.modal{position:static;background:#fff!important;padding:0!important}.modal-box{max-height:none;width:100%;box-shadow:none}.no-print{display:none!important}.print-sheet{font-size:9px}}
</style>
</head>
<body>
<header><h1>Production Daily Report — Assembly Line MC</h1><div class="lang">รายงานการผลิตประจำวัน / နေ့စဉ်ထုတ်လုပ်မှုအစီရင်ခံစာ</div></header>
<nav><button id="tabForm" class="active" onclick="showTab('form')">กรอกแบบฟอร์ม / ဖောင်ဖြည့်ရန်</button><button id="tabList" onclick="showTab('list')">List สรุปรายงาน / အစီရင်ခံစာစာရင်း</button></nav>
<main>
<section id="formTab">
<div class="card"><h2>ข้อมูลรายงาน / အစီရင်ခံစာအချက်အလက်</h2><div class="grid">
<div><label>ผู้บันทึก / မှတ်တမ်းတင်သူ</label><input id="recorder" required></div>
<div><label>Production Date / ထုတ်လုပ်သည့်ရက်စွဲ</label><input id="productionDate" type="date" required></div>
<div><label>Customer / ဖောက်သည်</label><input id="customer" value="ASIAN HONDA"></div>
<div><label>Model / မော်ဒယ်</label><input id="model" value="K58M" required></div>
<div><label>Part Name / အစိတ်အပိုင်းအမည်</label><input id="partName" value="MIRROR COMP"></div>
<div><label>Part No. / အစိတ်အပိုင်းနံပါတ်</label><input id="partNo" value="88210-K58-TC1"></div>
<div><label>Side / ဘက်</label><select id="side"><option value="RH">RH</option><option value="LH">LH</option><option value="RH/LH">RH / LH</option></select></div>
<div><label>Assembly Line / တပ်ဆင်လိုင်း</label><select id="line"><option>TQ 1-2</option><option>TQ 3-4</option><option>TQ 5-6</option><option>TQ 7-8</option><option>AS 1-2</option><option>AS 3-4</option><option>AS 5-6</option><option>AS 7-8</option></select></div>
</div></div>
<div id="shiftTables"></div>
<div class="card"><label>Remark / မှတ်ချက်</label><textarea id="remark" rows="3"></textarea><div class="actions"><button class="btn primary" onclick="saveReport()">ส่งรายงาน / အစီရင်ခံစာပို့ရန်</button><button class="btn secondary" onclick="resetForm()">ล้างฟอร์ม / ဖောင်ရှင်းရန်</button></div></div>
</section>
<section id="listTab" style="display:none"><div class="card"><h2>List สรุปใบรายงาน / အစီရင်ခံစာစာရင်း</h2><div class="grid"><div><label>วันที่ / ရက်စွဲ</label><input id="filterDate" type="date" oninput="loadReports()"></div><div><label>Model / မော်ဒယ်</label><input id="filterModel" oninput="loadReports()"></div><div><label>Line / လိုင်း</label><select id="filterLine" onchange="loadReports()"><option value="">ทั้งหมด / အားလုံး</option><option>TQ 1-2</option><option>TQ 3-4</option><option>TQ 5-6</option><option>TQ 7-8</option><option>AS 1-2</option><option>AS 3-4</option><option>AS 5-6</option><option>AS 7-8</option></select></div><div><label>ผู้บันทึก / မှတ်တမ်းတင်သူ</label><input id="filterRecorder" oninput="loadReports()"></div></div><div class="table-wrap" style="margin-top:14px"><table class="list-grid"><thead><tr><th>วันที่</th><th>Model</th><th>Line</th><th>Side</th><th>ผู้บันทึก</th><th>บันทึกเมื่อ</th><th>การทำงาน</th></tr></thead><tbody id="reportList"></tbody></table></div></div></section>
</main>
<div id="modal" class="modal"><div class="modal-box"><div class="actions no-print"><button class="btn primary" onclick="window.print()">พิมพ์ / PDF</button><button class="btn secondary" onclick="closePreview()">ปิด</button></div><div id="preview"></div></div></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyB5QdY-X_N4r6DCgCK1Crkzcrkio-Bh6BY',authDomain:'production-daily-report-87997.firebaseapp.com',projectId:'production-daily-report-87997',storageBucket:'production-daily-report-87997.firebasestorage.app',messagingSenderId:'84585550400',appId:'1:84585550400:web:c2c6880e3d16f1f4b805a5',measurementId:'G-6EYJJ3ZK76'};
const app=initializeApp(firebaseConfig), db=getFirestore(app); window.__db=db;
const times=['08.00-09.00','09.00-10.00','10.10-11.00','11.00-12.00','12.00-13.00','13.00-14.00','14.00-15.00','15.10-16.00','16.00-17.00','17.15-18.00','18.00-19.00','19.00-20.00','20.00-21.00','21.00-22.00'];
const problemGroups=[['Mirror (กระจก)','กระจก','ทะลุ','บิด','แตก','หัก'],['Torque','<1.13','>1.88','อื่นๆ'],['Holder','รอย/ชิ้น','Weld line','อื่นๆ'],['STAY','รอย','เกลียว','อื่นๆ'],['SCREW','ฉีก','เกลียว','อื่นๆ'],['Nut','รอย','ขัด','อื่นๆ']];
function makeTable(side){let s=`<div class="card"><h2>${side} — Production / ထုတ်လုပ်မှု</h2><div class="table-wrap"><table class="entry"><thead><tr><th rowspan="2">เวลา / အချိန်</th><th rowspan="2">ชิ้น/ชั่วโมง</th><th rowspan="2">Input</th><th colspan="6">Production (Pcs.)</th><th colspan="${problemGroups.reduce((n,g)=>n+g.length,0)}">Problem (ปัญหา / ပြဿနာ)</th></tr><tr><th>OK</th><th>%</th><th>Rework</th><th>%</th><th>NG</th><th>%</th>${problemGroups.map(g=>g.map(x=>`<th>${x}</th>`).join('')).join('')}</tr></thead><tbody>`;
for(let i=0;i<times.length;i++){if(i===4){s+=`<tr class="break"><td colspan="${9+problemGroups.reduce((n,g)=>n+g.length,0)}">Break / အနားယူချိန်</td></tr>`;continue;} const target=i===2||i===7?160:190; s+=`<tr data-side="${side}" data-index="${i}"><td class="time">${times[i]}</td><td>${target}</td><td><input type="number" class="input"></td><td><input type="number" class="ok"></td><td><input type="number" class="okp" readonly></td><td><input type="number" class="rework"></td><td><input type="number" class="rwp" readonly></td><td><input type="number" class="ng"></td><td><input type="number" class="ngp" readonly></td>${problemGroups.map(g=>g.map(()=>'<td><input type="number" class="prob" min="0"></td>').join('')).join('')}</tr>`; }
s+=`<tr><th>Total</th><th></th><th class="tot-input">0</th><th class="tot-ok">0</th><th></th><th class="tot-rework">0</th><th></th><th class="tot-ng">0</th><th></th>${problemGroups.map(g=>g.map(()=>'<th class="tot-prob">0</th>').join('')).join('')}</tr></tbody></table></div></div>`;return s;}
const shiftTables=document.getElementById('shiftTables'); shiftTables.innerHTML=makeTable('RH')+makeTable('LH');
function calculate(){document.querySelectorAll('tr[data-side]').forEach(tr=>{let i=+(tr.dataset.index), input=+tr.querySelector('.input')?.value||0, ok=+tr.querySelector('.ok')?.value||0, rw=+tr.querySelector('.rework')?.value||0, ng=+tr.querySelector('.ng')?.value||0; for(const [cl,val] of [['okp',ok],['rwp',rw],['ngp',ng]]){let el=tr.querySelector('.'+cl);if(el) el.value=input?((val/input)*100).toFixed(1):'';} });document.querySelectorAll('.card').forEach(()=>{});['RH','LH'].forEach(side=>{const rows=[...document.querySelectorAll(`tr[data-side="${side}"]`)], table=rows[0]?.closest('table'); if(!table)return; let sums=Array(6).fill(0); rows.forEach(r=>['input','ok','rework','ng'].forEach((c,j)=>sums[[0,1,2,3][j]]+=(+r.querySelector('.'+c)?.value||0))); table.querySelector('.tot-input').textContent=sums[0];table.querySelector('.tot-ok').textContent=sums[1];table.querySelector('.tot-rework').textContent=sums[2];table.querySelector('.tot-ng').textContent=sums[3];});}
function readSide(side){return [...document.querySelectorAll(`tr[data-side="${side}"]`)].map(tr=>({time:tr.cells[0].textContent,target:+tr.cells[1].textContent,input:+tr.querySelector('.input').value||0,ok:+tr.querySelector('.ok').value||0,rework:+tr.querySelector('.rework').value||0,ng:+tr.querySelector('.ng').value||0,problems:[...tr.querySelectorAll('.prob')].map(x=>+x.value||0)}));}
window.saveReport=async()=>{calculate(); const required=['recorder','productionDate','model','partName','partNo']; for(const id of required){if(!document.getElementById(id).value.trim()){alert('กรุณากรอกข้อมูลให้ครบ / ကျေးဇူးပြု၍ အချက်အလက်ပြည့်စုံစွာ ဖြည့်ပါ');document.getElementById(id).focus();return;}} const data={recorder:recorder.value.trim(),productionDate:productionDate.value,customer:customer.value.trim(),model:model.value.trim(),partName:partName.value.trim(),partNo:partNo.value.trim(),side:side.value,line:line.value,remark:remark.value.trim(),rh:readSide('RH'),lh:readSide('LH'),createdAt:new Date().toISOString()}; try{await addDoc(collection(db,'production_daily_reports'),data);alert('บันทึกรายงานเรียบร้อย / အစီရင်ခံစာကို မှတ်တမ်းတင်ပြီးပါပြီ');showTab('list');loadReports();}catch(e){console.error(e);alert('บันทึกไม่สำเร็จ: '+e.message);}};
window.loadReports=async()=>{const tbody=document.getElementById('reportList');tbody.innerHTML='<tr><td colspan="7">กำลังโหลด...</td></tr>';try{const qs=await getDocs(query(collection(db,'production_daily_reports'),orderBy('createdAt','desc')));const fd=document.getElementById('filterDate').value,fm=document.getElementById('filterModel').value.toLowerCase(),fl=document.getElementById('filterLine').value,fr=document.getElementById('filterRecorder').value.toLowerCase();let rows=[];qs.forEach(d=>{const r={id:d.id,...d.data()};if(fd&&r.productionDate!==fd)return;if(fm&&!r.model.toLowerCase().includes(fm))return;if(fl&&r.line!==fl)return;if(fr&&!r.recorder.toLowerCase().includes(fr))return;rows.push(r);});tbody.innerHTML=rows.length?rows.map(r=>`<tr><td>${r.productionDate}</td><td>${esc(r.model)}</td><td>${esc(r.line)}</td><td>${esc(r.side)}</td><td>${esc(r.recorder)}</td><td>${new Date(r.createdAt).toLocaleString('th-TH')}</td><td><button class="btn primary" onclick='previewReport(${JSON.stringify(r).replace(/'/g,"&#39;")})'>Preview</button> <button class="btn danger" onclick="deleteReport('${r.id}')">ลบ</button></td></tr>`).join(''):'<tr><td colspan="7">ยังไม่มีรายการรายงาน / အစီရင်ခံစာမရှိသေးပါ</td></tr>';}catch(e){tbody.innerHTML='<tr><td colspan="7">โหลดข้อมูลไม่ได้: '+esc(e.message)+'</td></tr>';}};
window.deleteReport=async id=>{if(!confirm('ยืนยันการลบรายงาน / ဖျက်ရန်အတည်ပြုပါသလား?'))return;await deleteDoc(doc(db,'production_daily_reports',id));loadReports();};
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function buildReportTable(side,data,meta){return `<h2 style="font-size:13px;margin:10px 0">Side : ${esc(side)}</h2><table class="report-table"><tr><th rowspan="2">เวลา</th><th rowspan="2">ชิ้น/ชม.</th><th colspan="6">Production (Pcs.)</th><th colspan="${problemGroups.reduce((n,g)=>n+g.length,0)}">Problem (ปัญหา / ပြဿနာ)</th></tr><tr><th>Input</th><th>OK</th><th>%</th><th>Rework</th><th>%</th><th>NG</th>${problemGroups.map(g=>g.map(x=>`<th>${x}</th>`).join('')).join('')}</tr>${data.map((r,i)=>`<tr class="${i===4?'break':''}"><td>${r.time}</td><td>${r.target}</td><td>${r.input||''}</td><td>${r.ok||''}</td><td>${r.input?(r.ok/r.input*100).toFixed(1):''}</td><td>${r.rework||''}</td><td>${r.input?(r.rework/r.input*100).toFixed(1):''}</td><td>${r.ng||''}</td>${r.problems.map(x=>`<td>${x||''}</td>`).join('')}</tr>`).join('')}</table>`;}
window.previewReport=r=>{const totalRows=[...r.rh,...r.lh];document.getElementById('preview').innerHTML=`<div class="print-sheet"><div class="print-head"><div><div style="font-size:15px;font-weight:800">NANO</div><div>Production Daily Report</div></div><div><h1>Production Daily Report_Assembly Line MC</h1><div>เช็ค Torque / ตรวจสอบแรงบิด</div></div><div class="print-meta"><div><b>Customer</b><span>${esc(r.customer)}</span></div><div><b>Model</b><span>${esc(r.model)}</span></div><div><b>Part Name</b><span>${esc(r.partName)}</span></div><div><b>Part No.</b><span>${esc(r.partNo)}</span></div><div><b>Side</b><span>${esc(r.side)}</span></div></div></div><div style="margin-top:5px">Production Date : ${esc(r.productionDate)} &nbsp;&nbsp; Assembly Line : ${esc(r.line)} &nbsp;&nbsp; ผู้บันทึก / မှတ်တမ်းတင်သူ : ${esc(r.recorder)}</div>${buildReportTable('RH',r.rh,r)}${buildReportTable('LH',r.lh,r)}<div style="margin-top:8px">Remark / မှတ်ချက် : ${esc(r.remark)}</div><div class="foot-sign"><div>ผู้บันทึก / မှတ်တမ်းတင်သူ<br><br>________________________</div><div>หัวหน้าฝ่ายผลิต / ထုတ်လုပ်ရေးခေါင်းဆောင်<br><br>________________________</div><div>ผู้จัดการฝ่ายผลิต / ထုတ်လုပ်ရေးမန်နေဂျာ<br><br>________________________</div></div></div>`;document.getElementById('modal').classList.add('open');};
window.closePreview=()=>document.getElementById('modal').classList.remove('open');
window.showTab=tab=>{document.getElementById('formTab').style.display=tab==='form'?'block':'none';document.getElementById('listTab').style.display=tab==='list'?'block':'none';document.getElementById('tabForm').classList.toggle('active',tab==='form');document.getElementById('tabList').classList.toggle('active',tab==='list');if(tab==='list')loadReports();};
window.resetForm=()=>{document.querySelectorAll('#formTab input,#formTab textarea').forEach(x=>{if(!['customer','model','partName','partNo'].includes(x.id))x.value='';});document.querySelectorAll('#formTab .input,#formTab .ok,#formTab .rework,#formTab .ng,#formTab .prob').forEach(x=>x.value='');};
setInterval(calculate,500); document.getElementById('productionDate').value=new Date().toISOString().slice(0,10);
</script>
</body>
</html>
